<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<title>Letterhead 19h47</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="app-style.css">
<style>
/* Ce que l'outil ajoute à app-style.css, la base partagée des petites apps : une feuille A4 éditable en place.
   La barre d'outils, les pastilles et les boutons disparaissent à l'impression. */
:root {
	/* La feuille reste du papier blanc, quel que soit le thème */
	--letterhead-paper: rgb(255, 255, 255);
	--letterhead-ink: rgb(26, 26, 26);
	--letterhead-paper-muted: rgb(92, 92, 92);
	--letterhead-paper-line: rgb(201, 196, 184);
	--letterhead-paper-fill: color-mix(in srgb, var(--letterhead-paper-line) 20%, transparent);
	--letterhead-font-sheet: "Work Sans", "Helvetica Neue", Arial, sans-serif;
}

/* La feuille commence un pas sous les pastilles et la barre d'outils, qui la recouvrent sinon */
.letterhead-page { padding: calc(var(--app-toolbar-top) + var(--app-control-size) + var(--app-u2)) var(--app-u2) var(--app-u3); overflow-x: auto; }

/* Les pastilles restent en haut à gauche, face à la barre d'outils, flottantes comme elle au-dessus de la feuille qui défile */
.letterhead-pills { position: fixed; top: var(--app-toolbar-top); left: var(--app-u2); z-index: 1; display: flex; gap: var(--app-control-gap); }
.letterhead-pills .app-pill { background: var(--app-bg); }
.app-pill input[type="date"] { border: none; background: transparent; color: inherit; font: inherit; text-transform: inherit; cursor: pointer; }

/* Cotes reprises du gabarit InDesign : Work Sans 12 pt, grille de 14 pt, marges de 98 pt en haut et en bas, 52,64 pt sur les côtés.
   En colonne flexible, le pied de page se cale en bas de la feuille. */
.sheet {
	position: relative; display: flex; flex-direction: column;
	width: 210mm; min-height: 297mm; margin: 0 auto; padding: 98pt 52.64pt;
	background: var(--letterhead-paper); color: var(--letterhead-ink); color-scheme: light;
	font-family: var(--letterhead-font-sheet); font-size: 12pt; line-height: 14pt;
	border: 1px solid var(--app-line-soft);
}

[contenteditable] { outline: none; border-radius: 2px; white-space: pre-line; }
[contenteditable]:hover, [contenteditable]:focus { background: var(--letterhead-paper-fill); }
[contenteditable]:focus { box-shadow: 0 0 0 1px var(--letterhead-paper-line); }
[contenteditable]:empty::before { content: attr(data-ph); color: var(--letterhead-paper-muted); }

.brand, footer .site { font-size: 18pt; font-weight: 500; letter-spacing: .1em; }
.brand { margin-bottom: 28pt; }
.parties { display: grid; grid-template-columns: 210pt 1fr; margin-left: 84pt; }
.parties > div::first-line { font-weight: 500; }
h1 { max-width: 406pt; font-weight: 500; font-size: 30pt; line-height: 28pt; margin: 28pt 0 28pt 42pt; }

table { width: 100%; table-layout: fixed; border-collapse: collapse; font-variant-numeric: tabular-nums; }
col.c-desc { width: 238pt; }
th { font-weight: 500; letter-spacing: .1em; text-transform: uppercase; text-align: right; padding: 0 0 14pt; }
th:first-child, td:first-child { text-align: left; }
td { vertical-align: top; text-align: right; padding: 0 0 14pt; position: relative; }
td .detail { display: block; font-size: 10pt; }
td .hours { display: block; font-family: var(--app-font-ui); font-size: 7pt; text-transform: uppercase; color: var(--letterhead-paper-muted); }
tr { break-inside: avoid; }
tbody tr .remove {
	position: absolute; left: -12mm; top: 0; padding: 0 6px; border: 0; background: none; cursor: pointer;
	color: var(--letterhead-paper-muted); font-family: var(--app-font-ui); font-size: 14px; line-height: 14pt;
	opacity: 0; transition: opacity var(--app-transition-1);
}
tbody tr:hover .remove, .remove:focus-visible { opacity: 1; }
.remove:hover { color: var(--letterhead-ink); }
/* Posé dans le blanc à gauche de « Total HT », hors du flux pour ne pas décaler la grille */
.add {
	position: absolute; left: 0; top: 14pt; height: 14pt; padding: 0 1em;
	border-radius: calc(infinity * 1px); border: 1px solid var(--letterhead-paper-line); background: none; cursor: pointer;
	color: var(--letterhead-paper-muted); font-family: var(--app-font-ui); font-size: var(--app-font-small);
	font-weight: 400; letter-spacing: 0; text-transform: uppercase; line-height: 1;
}
.add:hover { color: var(--letterhead-ink); }
tfoot tr:first-child td { padding-top: 14pt; }
tfoot td:first-child { text-align: right; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; }
tfoot sup { font-size: 7pt; line-height: 0; }

/* Aligné à droite sur la colonne Description, comme les libellés des totaux */
.place { width: 238pt; text-align: right; font-size: 10pt; margin: 0 0 14pt; }
/* Numéro et « Fait à » n'existent que sur une facture */
.sheet:not([data-kind="facture"]) .facture-only { display: none; }
footer { display: flex; justify-content: space-between; align-items: baseline; gap: 14pt; margin-top: auto; }
footer .ref { font-weight: 500; }

/* Grille de contrôle : 12 colonnes de 28 pt, gouttières de 14 pt, lignes de base tous les 14 pt. G pour l'afficher. */
letterhead-grid {
	position: absolute; inset: 0; z-index: 1; pointer-events: none;
	background: repeating-linear-gradient(to bottom, transparent 0 calc(14pt - 1px), color-mix(in srgb, var(--letterhead-paper-line) 70%, transparent) calc(14pt - 1px) 14pt);
}
letterhead-grid > div { position: absolute; inset: 0 52.64pt; display: grid; grid-template-columns: repeat(12, 1fr); column-gap: 14pt; }
letterhead-grid span { position: relative; background: color-mix(in srgb, var(--letterhead-paper-line) 15%, transparent); }
letterhead-grid span:nth-child(even) { background: color-mix(in srgb, var(--letterhead-paper-line) 6%, transparent); }
letterhead-grid span::after {
	content: attr(data-index); position: absolute; inset-inline: 0; bottom: 4pt; text-align: center;
	font-family: var(--app-font-ui); font-size: 7pt; color: var(--letterhead-paper-muted);
}

@page { size: A4; margin: 0; }
@media print {
	html { background: #fff; }
	.letterhead-page { padding: 0; overflow: visible; }
	.letterhead-pills, .add, .remove, .hours, letterhead-grid { display: none !important; }
	.sheet { border: 0; margin: 0; }
	[contenteditable]:empty::before { content: none; }
}
</style>
</head>
<body>
<div class="letterhead-pills">
	<label class="app-pill"><span class="sr-only">Document</span><select id="kind"><button><strong aria-hidden="true">Document</strong> <selectedcontent></selectedcontent></button><option value="devis">Devis</option><option value="facture">Facture</option></select></label>
	<label class="app-pill"><span><strong>Date</strong></span><input type="date" id="date"></label>
</div>
<div class="app-toolbar">
	<button type="button" class="app-control" id="new" aria-label="Nouveau document" title="Nouveau document">+</button>
	<button type="button" class="app-control" id="import" aria-label="Importer un document (.json)" title="Importer un document (.json)">⤒&#xFE0E;</button>
	<button type="button" class="app-control" id="export" aria-label="Exporter le document (.json)" title="Exporter le document (.json)">⤓&#xFE0E;</button>
	<button type="button" class="app-control" id="grid" aria-label="Afficher la grille (G)" title="Afficher la grille (G)" aria-pressed="false">#</button>
	<button type="button" class="app-control" id="print" aria-label="Enregistrer en PDF (⌘P)" title="Enregistrer en PDF (⌘P)">⎙&#xFE0E;</button>
	<button type="button" class="app-control" id="theme" aria-label="Changer de thème" title="Changer de thème"></button>
	<input type="file" id="importFile" accept=".json,application/json" hidden>
</div>

<main class="letterhead-page">
<article class="sheet" id="sheet">
	<letterhead-grid aria-hidden="true" hidden><div></div></letterhead-grid>
	<div class="brand">19h47</div>
	<div class="parties">
		<div>
			<div contenteditable="plaintext-only" data-key="issuer" data-ph="Émetteur"></div>
			<p class="facture-only">Numéro de facture <span contenteditable="plaintext-only" data-key="number" data-ph="2026001"></span></p>
			<div contenteditable="plaintext-only" data-key="vatNumber" data-ph="N° de TVA intracommunautaire"></div>
		</div>
		<div contenteditable="plaintext-only" data-key="client" data-ph="Client"></div>
	</div>
	<h1 contenteditable="plaintext-only" data-key="title" data-ph="Titre"></h1>
	<table>
		<colgroup><col class="c-desc"><col><col><col></colgroup>
		<thead><tr><th>Description</th><th>Quantité</th><th>Prix</th><th>Total</th></tr></thead>
		<tbody id="lines"></tbody>
		<tfoot>
			<tr><td><button type="button" class="add" id="add">+ Ligne</button>Total HT</td><td id="qtyTotal"></td><td></td><td id="ht"></td></tr>
			<tr><td>TVA <sup><span contenteditable="plaintext-only" data-key="vat"></span>%</sup></td><td></td><td></td><td id="vatTotal"></td></tr>
			<tr><td>Total TTC</td><td></td><td></td><td id="ttc"></td></tr>
		</tfoot>
	</table>
	<p class="place"><span class="facture-only">Fait à </span><span contenteditable="plaintext-only" data-key="place" data-ph="Lieu"></span>, le <span class="long-date"></span></p>
	<footer><span class="site">19h47.fr</span><span class="ref"><span id="kindLabel"></span> - <span id="issuerName"></span> - <span class="long-date"></span></span></footer>
</article>
</main>

<script>
const STORAGE_KEY = 'letterhead-document';
const RATE = '500';
const today = () => new Date().toISOString().slice(0, 10);
const emptyLine = () => ({ label: '', detail: '', qty: '0,125', price: RATE });

const KINDS = { devis: 'Devis', facture: 'Facture' };

const DEFAULT = {
	kind: 'devis',
	number: '',
	issuer: '',
	vatNumber: '',
	client: '',
	title: '',
	place: '',
	date: today(),
	vat: '20',
	lines: [emptyLine()],
};

const $ = id => document.getElementById(id);
const parse = v => parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.')) || 0;
const round2 = n => Math.round(n * 100) / 100;
const fmtNum = n => new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 4 }).format(n);
const fmtEur = n => new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 2 }).format(round2(n)) + ' €';
const fmtDate = iso => iso ? new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Une facture prend aussi son numéro, comme 2026-10-19-2026019
const fileName = () => [state.date || today(), state.kind === 'facture' && state.number].filter(Boolean).join('-');

// 1 jour = 8 h, affiché à l'écran seulement
function fmtHours(qty) {
	const minutes = Math.round(qty * 8 * 60);
	if (minutes <= 0) return '';
	const h = Math.floor(minutes / 60), m = minutes % 60;
	return h ? (m ? `${h} h ${String(m).padStart(2, '0')}` : `${h} h`) : `${m} min`;
}

let state = load();

function load() {
	try {
		const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
		if (saved && Array.isArray(saved.lines)) return { ...DEFAULT, ...saved };
	} catch (e) {}
	return structuredClone(DEFAULT);
}

function save() {
	try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function renderLines() {
	$('lines').innerHTML = state.lines.map((line, i) => `
		<tr data-index="${i}">
			<td>
				<button type="button" class="remove" aria-label="Supprimer la ligne">×</button>
				<span contenteditable="plaintext-only" data-field="label" data-ph="Intitulé">${escapeHtml(line.label)}</span>
				<span class="detail" contenteditable="plaintext-only" data-field="detail" data-ph="Détail (facultatif)">${escapeHtml(line.detail)}</span>
			</td>
			<td><span contenteditable="plaintext-only" data-field="qty">${escapeHtml(line.qty)}</span><span class="hours"></span></td>
			<td><span contenteditable="plaintext-only" data-field="price">${escapeHtml(line.price)}</span> €</td>
			<td class="total"></td>
		</tr>`).join('');
}

// Ne touche qu'aux valeurs calculées, pour ne pas perdre le curseur pendant la saisie
function renderTotals() {
	let qtyTotal = 0, ht = 0;
	[...$('lines').rows].forEach((row, i) => {
		const qty = parse(state.lines[i].qty);
		const total = round2(qty * parse(state.lines[i].price));
		qtyTotal += qty;
		ht += total;
		row.querySelector('.total').textContent = fmtEur(total);
		row.querySelector('.hours').textContent = fmtHours(qty);
	});
	const vat = round2(ht * parse(state.vat) / 100);
	$('qtyTotal').textContent = fmtNum(qtyTotal);
	$('ht').textContent = fmtEur(ht);
	$('vatTotal').textContent = fmtEur(vat);
	$('ttc').textContent = fmtEur(ht + vat);
	document.querySelectorAll('.long-date').forEach(el => { el.textContent = fmtDate(state.date); });
	$('issuerName').textContent = (state.issuer || '').split('\n')[0];
}

function render() {
	document.querySelectorAll('[data-key]').forEach(el => { el.textContent = state[el.dataset.key] ?? ''; });
	$('sheet').dataset.kind = state.kind;
	$('kind').value = state.kind;
	$('kindLabel').textContent = KINDS[state.kind];
	$('date').value = state.date;
	renderLines();
	renderTotals();
}

function update() {
	save();
	renderTotals();
}

$('sheet').addEventListener('input', e => {
	const el = e.target;
	if (el.dataset.key) {
		state[el.dataset.key] = el.innerText.replace(/\n$/, '');
	} else if (el.dataset.field) {
		state.lines[el.closest('tr').dataset.index][el.dataset.field] = el.innerText.replace(/\n$/, '');
	}
	update();
});

$('lines').addEventListener('click', e => {
	if (!e.target.classList.contains('remove')) return;
	state.lines.splice(Number(e.target.closest('tr').dataset.index), 1);
	save();
	render();
});

$('add').addEventListener('click', () => {
	state.lines.push(emptyLine());
	save();
	render();
	$('lines').lastElementChild.querySelector('[data-field="label"]').focus();
});

$('date').addEventListener('input', e => {
	state.date = e.target.value;
	update();
});

$('kind').addEventListener('change', e => {
	state.kind = e.target.value;
	save();
	render();
});

$('new').addEventListener('click', () => {
	if (!confirm('Vider le document en cours ? Exporte-le avant si tu veux le garder.')) return;
	const title = `${KINDS[state.kind]} évolution Shopify`;
	state = { ...state, number: '', client: '', title, date: today(), lines: [emptyLine()] };
	save();
	render();
});

$('export').addEventListener('click', () => {
	const a = document.createElement('a');
	a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, '\t')], { type: 'application/json' }));
	a.download = `${fileName()}.json`;
	a.click();
	URL.revokeObjectURL(a.href);
});

$('import').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', async e => {
	const file = e.target.files[0];
	if (!file) return;
	try {
		const data = JSON.parse(await file.text());
		if (!Array.isArray(data.lines)) throw new Error();
		state = { ...DEFAULT, ...data };
		save();
		render();
	} catch (err) {
		alert('Ce fichier n’est pas un document exporté depuis cet outil.');
	}
	e.target.value = '';
});

// Le PDF proposé prend la date pour nom, comme 2026-09-09.pdf
const appTitle = document.title;
window.addEventListener('beforeprint', () => { document.title = fileName(); });
window.addEventListener('afterprint', () => { document.title = appTitle; });
$('print').addEventListener('click', () => window.print());

// Thème : suit le système tant qu'aucun choix n'a été fait, comme sur sms ou typewriter
const THEME_KEY = 'letterhead-theme';
const darkQuery = matchMedia('(prefers-color-scheme: dark)');
let chosenTheme = null;
try { chosenTheme = ['light', 'dark'].includes(localStorage.getItem(THEME_KEY)) ? localStorage.getItem(THEME_KEY) : null; } catch (e) {}

function applyTheme() {
	const theme = chosenTheme ?? (darkQuery.matches ? 'dark' : 'light');
	document.documentElement.dataset.theme = theme;
	document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.documentElement).backgroundColor;
	$('theme').textContent = theme === 'dark' ? '☀︎' : '☽︎';
	$('theme').setAttribute('aria-pressed', String(theme === 'dark'));
}

$('theme').addEventListener('click', () => {
	chosenTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
	try { localStorage.setItem(THEME_KEY, chosenTheme); } catch (e) {}
	applyTheme();
});
darkQuery.addEventListener('change', applyTheme);

// Grille de contrôle, comme cinq-grid sur Eigrene : G pour basculer, état gardé le temps de la session
class LetterheadGrid extends HTMLElement {
	static STORAGE_KEY = 'letterhead-grid';

	connectedCallback() {
		this.firstElementChild.innerHTML = Array.from({ length: 12 }, (_, i) => `<span data-index="${i + 1}"></span>`).join('');
		let stored = null;
		try { stored = sessionStorage.getItem(LetterheadGrid.STORAGE_KEY); } catch (e) {}
		this.toggle(stored === 'on');
		document.addEventListener('keydown', this.onKeydown);
		$('grid').addEventListener('click', () => this.toggle());
	}

	disconnectedCallback() {
		document.removeEventListener('keydown', this.onKeydown);
	}

	toggle(force = this.hidden) {
		this.hidden = !force;
		$('grid').setAttribute('aria-pressed', String(force));
		try { sessionStorage.setItem(LetterheadGrid.STORAGE_KEY, force ? 'on' : 'off'); } catch (e) {}
	}

	onKeydown = event => {
		const { key, metaKey, ctrlKey, altKey, target } = event;
		if (key !== 'g' && key !== 'G') return;
		if (metaKey || ctrlKey || altKey) return;
		if (target instanceof HTMLElement && target.closest('input, textarea, select, [contenteditable]')) return;
		event.preventDefault();
		this.toggle();
	};
}

customElements.define('letterhead-grid', LetterheadGrid);

applyTheme();
render();
</script>
</body>
</html>
